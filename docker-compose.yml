# Production stack for the Hetzner server. Nothing is published on a host port: public traffic
# arrives only through the Cloudflare Tunnel (cloudflared → frontend, which proxies /api).
#
#   docker compose up -d                 # start / update the stack
#   docker compose run --rm migrate      # apply database migrations
#   docker compose run --rm backup once  # take a backup now
#
# Deploys normally go through scripts/deploy.sh (called by GitHub Actions).

# Logs stay on the server as before (20 MB x 5 per container), now labelled with the compose service
# so the optional "logs" service can ship them to Better Stack by name (CD-102).
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"
    labels: com.docker.compose.service

x-backend-env: &backend-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  AUTH_MODE: ${AUTH_MODE:-oidc}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  AUTH0_MANAGEMENT_DOMAIN: ${AUTH0_MANAGEMENT_DOMAIN:-}
  AUTH0_MANAGEMENT_CLIENT_ID: ${AUTH0_MANAGEMENT_CLIENT_ID:-}
  AUTH0_MANAGEMENT_CLIENT_SECRET: ${AUTH0_MANAGEMENT_CLIENT_SECRET:-}
  AUTH0_DB_CONNECTION: ${AUTH0_DB_CONNECTION:-Username-Password-Authentication}
  AUTH_GOOGLE_CONNECTION: ${AUTH_GOOGLE_CONNECTION-google-oauth2}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  STORAGE_DIR: /app/storage
  APP_URL: ${APP_URL}
  APP_SECRET: ${APP_SECRET}
  MAIL_DRIVER: ${MAIL_DRIVER:-log}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-Cadence <no-reply@localhost>}
  MAIL_RETRY_LIMIT: ${MAIL_RETRY_LIMIT:-4}
  MAIL_RETRY_DELAY_SECONDS: ${MAIL_RETRY_DELAY_SECONDS:-30}
  # Error tracking (CD-8): empty = off. The version tags each error with the deployed commit.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  APP_VERSION: ${APP_VERSION:-latest}

services:
  frontend:
    logging: *logging
    # The staging stack sets FRONTEND_VARIANT=-staging: the frontend is built per environment
    # because the sign-in app and Sentry environment are compiled into it.
    image: ${IMAGE_PREFIX:-crm}-frontend:${APP_VERSION:-latest}${FRONTEND_VARIANT:-}
    build:
      context: ./frontend
      args:
        VITE_AUTH_MODE: ${AUTH_MODE:-oidc}
        VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:-}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
        VITE_OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  api:
    logging: *logging
    image: ${IMAGE_PREFIX:-crm}-backend:${APP_VERSION:-latest}
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 3000
    volumes:
      - app_storage:/app/storage
    # A runaway request (e.g. a crafted document) is killed and restarted instead of taking the
    # whole server's memory (CD-104). Node sizes its heap to this limit.
    mem_limit: ${API_MEM_LIMIT:-768m}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, data]

  worker:
    logging: *logging
    image: ${IMAGE_PREFIX:-crm}-backend:${APP_VERSION:-latest}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - app_storage:/app/storage
    mem_limit: ${WORKER_MEM_LIMIT:-768m}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    # "edge" only for outbound internet (integrations, email). Nothing routes to the worker.
    networks: [data, edge]

  migrate:
    logging: *logging
    image: ${IMAGE_PREFIX:-crm}-backend:${APP_VERSION:-latest}
    command: ["node", "dist/shared/database/migrate.js"]
    profiles: [tools]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_MODE: oidc
      OIDC_ISSUER: https://unused.invalid/
      OIDC_AUDIENCE: unused
      APP_URL: https://unused.invalid
      APP_SECRET: unused-by-migrations-but-required-in-production
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  postgres:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Internal network only: never reachable from the internet or the tunnel.
    networks: [data]

  cloudflared:
    logging: *logging
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.9.1}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [frontend]
    networks: [edge]

  backup:
    logging: *logging
    build: ./infra/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # restore.sh hands the pgboss schema back to this role after a restore (CD-89).
      APP_DB_USER: ${APP_DB_USER}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_WEEKLY_RETENTION_DAYS: ${BACKUP_WEEKLY_RETENTION_DAYS:-90}
      # Off-server copy via rclone (e.g. Hetzner Storage Box / Object Storage wrapped in an
      # rclone "crypt" remote so copies are encrypted). Leave empty to keep local copies only.
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      # Alerts (CD-8): Better Stack heartbeat URLs; empty = no alerts.
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      DISK_HEARTBEAT_URL: ${DISK_HEARTBEAT_URL:-}
      DISK_ALERT_PERCENT: ${DISK_ALERT_PERCENT:-85}
    volumes:
      - backups:/backups
      # Uploaded templates and generated documents (CD-13), archived next to each dump. Writable
      # so restore.sh can put a files archive back.
      - app_storage:/storage
      - ./infra/backup/rclone.conf:/config/rclone/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, edge]

  # Ships every container's logs to Better Stack (CD-102). Off unless COMPOSE_PROFILES=logs and the
  # Better Stack source's host and token are set in .env (docs/DEPLOYMENT.md). It reads the log
  # files read-only; it has no Docker socket.
  logs:
    image: timberio/vector:0.58.0-alpine
    profiles: [logs]
    restart: unless-stopped
    logging: *logging
    # Mounted as files in /run/secrets, where vector.yaml reads them.
    secrets: [betterstack_logs_host, betterstack_logs_token]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/logs/vector.yaml:/etc/vector/vector.yaml:ro
      - logs_state:/var/lib/vector
    mem_limit: 256m
    networks: [edge]

networks:
  edge: {}
  data:
    internal: true

volumes:
  logs_state:
  postgres_data:
  app_storage:
  backups:

secrets:
  betterstack_logs_host:
    environment: BETTERSTACK_LOGS_HOST
  betterstack_logs_token:
    environment: BETTERSTACK_LOGS_TOKEN
