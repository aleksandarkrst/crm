# pultly.com: the static marketing site. Pages are clean paths (/blog, /blog/<post>): any path
# without a file falls back to index.html and the client-side router picks the page.
# The Cloudflare Tunnel routes pultly.com and www.pultly.com → http://website:80.

# The site's own files plus Google Fonts; inline style attributes come from React.
map $host $csp {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # One address for the site: www.pultly.com/... → https://pultly.com/...
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Hashed build assets: cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
