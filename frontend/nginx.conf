# Serves the SPA and proxies /api to the backend, so the whole app lives on one hostname
# (no CORS, simple cookies). The Cloudflare Tunnel only needs one route: → http://frontend:80
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Real client IP from Cloudflare.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header CF-Connecting-IP;

  client_max_body_size 25m;

  # Security headers for what nginx serves itself. They are repeated in each location below, not
  # set here once: nginx drops every inherited add_header in a location that has its own (the
  # Cache-Control ones), which left the app page without them. /api gets its headers from the API
  # (helmet), so it has none here and no duplicates.
  location = /healthz {
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    return 200 "ok";
  }

  # Resolve "api" through Docker's DNS on each request (cached 10s) instead of once at startup,
  # so the proxy keeps working when a deploy recreates the api container with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  # Hashed build assets: cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }

  # Client-side routes fall back to index.html (never cached, so deploys show up immediately).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
