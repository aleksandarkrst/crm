name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_images:
        description: Build both Docker images without publishing them (useful on a branch)
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # The API against a real PostgreSQL: RLS tenant isolation, composite FKs, roles, invitations.
  integration:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app_admin, POSTGRES_PASSWORD: ci_admin_password, POSTGRES_DB: app }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app_admin -d app" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # Same setup as production: migrations run as the owner, the API as the non-owner runtime role.
      PGHOST: localhost
      PGPASSWORD: ci_admin_password
      POSTGRES_USER: app_admin
      POSTGRES_DB: app
      APP_DB_USER: app_runtime
      APP_DB_PASSWORD: ci_runtime_password
      MIGRATION_DATABASE_URL: postgres://app_admin:ci_admin_password@localhost:5432/app
      DATABASE_URL: postgres://app_runtime:ci_runtime_password@localhost:5432/app
      AUTH_MODE: dev
      DEV_JWT_SECRET: ci-only-dev-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Create the runtime role and pgboss schema (as the Postgres image's init would)
        run: sh ../infra/postgres/init/01-roles.sh
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:integration

  # The UI in a real browser against the API and PostgreSQL.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app_admin, POSTGRES_PASSWORD: ci_admin_password, POSTGRES_DB: app }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app_admin -d app" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGPASSWORD: ci_admin_password
      POSTGRES_USER: app_admin
      POSTGRES_DB: app
      APP_DB_USER: app_runtime
      APP_DB_PASSWORD: ci_runtime_password
      MIGRATION_DATABASE_URL: postgres://app_admin:ci_admin_password@localhost:5432/app
      DATABASE_URL: postgres://app_runtime:ci_runtime_password@localhost:5432/app
      AUTH_MODE: dev
      DEV_JWT_SECRET: ci-only-dev-secret-at-least-32-characters
      LOG_LEVEL: warn
      PORT: 3000
      # The browser tests sign in many users from one address (CD-18).
      RATE_LIMIT_ENABLED: 'false'
      APP_URL: http://localhost:4173
      VITE_API_PROXY: http://127.0.0.1:3000
      E2E_BASE_URL: http://localhost:4173
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/e2e/artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Create the runtime role and pgboss schema
        run: sh infra/postgres/init/01-roles.sh
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Build and migrate
        run: |
          npm run build --prefix backend
          npm run db:migrate --prefix backend
          npm run build --prefix frontend
      - name: Start the API, the worker (documents, emails) and the UI (vite preview, proxying /api to the API)
        run: |
          mkdir -p e2e/artifacts
          (cd backend && nohup node dist/main.js > ../e2e/artifacts/api.log 2>&1 &)
          (cd backend && nohup node dist/worker.js > ../e2e/artifacts/worker.log 2>&1 &)
          (cd frontend && nohup npx vite preview --port 4173 --strictPort > ../e2e/artifacts/ui.log 2>&1 &)
          for i in $(seq 60); do
            curl -fsS http://localhost:4173/api/health/ready && curl -fsS -o /dev/null http://localhost:4173/ && exit 0
            sleep 1
          done
          echo "API or UI did not start"; cat e2e/artifacts/api.log e2e/artifacts/ui.log; exit 1
      - name: Run the browser tests
        run: npm test --prefix e2e
      - name: Upload screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: e2e-artifacts, path: e2e/artifacts, if-no-files-found: ignore }

  images:
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.verify_images)
    needs: [backend, frontend, integration, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main' && !inputs.verify_images
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/main' && !inputs.verify_images }}
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }},${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: ${{ github.ref == 'refs/heads/main' && !inputs.verify_images }}
          build-args: |
            VITE_AUTH_MODE=${{ vars.AUTH_MODE || 'oidc' }}
            VITE_SENTRY_DSN=${{ vars.SENTRY_FRONTEND_DSN }}
            VITE_APP_VERSION=${{ github.sha }}
            CSP_ENFORCE=${{ vars.CSP_ENFORCE || 'false' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_FRONTEND_PROJECT }}
          # Source maps for Sentry (CD-102); empty = none uploaded. A build secret, not an arg, so it
          # never lands in the image.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }},${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # The same commit built for staging (CD-105): its own sign-in app and API audience, and
      # errors tagged "staging". Tagged <sha>-staging; the backend image is shared.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: vars.STAGING_DEPLOY_ENABLED == 'true'
        with:
          context: frontend
          push: ${{ github.ref == 'refs/heads/main' && !inputs.verify_images }}
          build-args: |
            VITE_AUTH_MODE=${{ vars.AUTH_MODE || 'oidc' }}
            VITE_SENTRY_DSN=${{ vars.SENTRY_FRONTEND_DSN }}
            VITE_SENTRY_ENVIRONMENT=staging
            VITE_APP_VERSION=${{ github.sha }}
            # Staging enforces the Content-Security-Policy, so a violation breaks staging first.
            CSP_ENFORCE=${{ vars.STAGING_CSP_ENFORCE || 'true' }}
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}-staging
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend-staging

  # With staging (STAGING_DEPLOY_ENABLED=true), every merge to main goes to staging: /opt/crm-staging
  # on the same server, with its own Compose project, database, tunnel and sign-in app. The smoke
  # test runs there. Production then gets the same commit from the "Promote to production"
  # workflow (promote.yml) once someone has checked it on staging.
  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.verify_images && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: [images]
    uses: ./.github/workflows/deploy.yml
    with: { environment: staging, app_dir: /opt/crm-staging, sha: '${{ github.sha }}', verify: true }
    secrets: inherit
    permissions: { contents: read, packages: read }

  # Without staging, production follows every merge directly.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.verify_images && vars.DEPLOY_ENABLED == 'true' && vars.STAGING_DEPLOY_ENABLED != 'true'
    needs: [images]
    uses: ./.github/workflows/deploy.yml
    with: { environment: production, app_dir: /opt/crm, sha: '${{ github.sha }}', verify: false }
    secrets: inherit
    permissions: { contents: read, packages: read }
