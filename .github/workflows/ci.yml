name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_images:
        description: Build both Docker images without publishing them (useful on a branch)
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # The API against a real PostgreSQL: RLS tenant isolation, composite FKs, roles, invitations.
  # The job itself (Postgres service, roles, migrations) is db-tests.yml, shared with nightly.yml.
  integration:
    uses: ./.github/workflows/db-tests.yml
    with: { script: test:integration }

  images:
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.verify_images)
    needs: [backend, frontend, website, integration]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main' && !inputs.verify_images
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/main' && !inputs.verify_images }}
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }},${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: ${{ github.ref == 'refs/heads/main' && !inputs.verify_images }}
          build-args: |
            VITE_AUTH_MODE=${{ vars.AUTH_MODE || 'oidc' }}
            VITE_SENTRY_DSN=${{ vars.SENTRY_FRONTEND_DSN }}
            VITE_APP_VERSION=${{ github.sha }}
            CSP_ENFORCE=${{ vars.CSP_ENFORCE || 'false' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_FRONTEND_PROJECT }}
          # Source maps for Sentry (CD-102); empty = none uploaded. A build secret, not an arg, so it
          # never lands in the image.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }},${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # The same commit built for staging (CD-105): its own sign-in app and API audience, and
      # errors tagged "staging". Tagged <sha>-staging; the backend image is shared.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: vars.STAGING_DEPLOY_ENABLED == 'true'
        with:
          context: frontend
          push: ${{ github.ref == 'refs/heads/main' && !inputs.verify_images }}
          build-args: |
            VITE_AUTH_MODE=${{ vars.AUTH_MODE || 'oidc' }}
            VITE_SENTRY_DSN=${{ vars.SENTRY_FRONTEND_DSN }}
            VITE_SENTRY_ENVIRONMENT=staging
            VITE_APP_VERSION=${{ github.sha }}
            # Staging enforces the Content-Security-Policy, so a violation breaks staging first.
            CSP_ENFORCE=${{ vars.STAGING_CSP_ENFORCE || 'true' }}
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}-staging
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend-staging
      # The public website (pultly.com). Its Sign in and Create account link to the app.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: website
          push: ${{ github.ref == 'refs/heads/main' && !inputs.verify_images }}
          build-args: |
            VITE_APP_URL=${{ vars.PRODUCTION_URL || 'https://app.pultly.com' }}
            VITE_MAILERLITE_ACCOUNT_ID=${{ vars.MAILERLITE_ACCOUNT_ID }}
            VITE_MAILERLITE_FORM_ID=${{ vars.MAILERLITE_FORM_ID }}
          tags: ${{ env.IMAGE_PREFIX }}-website:${{ github.sha }},${{ env.IMAGE_PREFIX }}-website:latest
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
      # Staging's website links to the staging app instead. It gets no MailerLite form, so trying the
      # newsletter on staging never adds anyone to the real list.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: vars.STAGING_DEPLOY_ENABLED == 'true'
        with:
          context: website
          push: ${{ github.ref == 'refs/heads/main' && !inputs.verify_images }}
          build-args: |
            VITE_APP_URL=${{ vars.STAGING_URL || 'https://staging.pultly.com' }}
          tags: ${{ env.IMAGE_PREFIX }}-website:${{ github.sha }}-staging
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website-staging

  # With staging (STAGING_DEPLOY_ENABLED=true), every merge to main goes to staging: /opt/crm-staging
  # on the same server, with its own Compose project, database, tunnel and sign-in app. The smoke
  # test runs there. Production then gets the same commit from the "Promote to production"
  # workflow (promote.yml) once someone has checked it on staging.
  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.verify_images && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: [images]
    uses: ./.github/workflows/deploy.yml
    with: { environment: staging, app_dir: /opt/crm-staging, sha: '${{ github.sha }}', verify: true }
    secrets: inherit
    permissions: { contents: read, packages: read }

  # Without staging, production follows every merge directly.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.verify_images && vars.DEPLOY_ENABLED == 'true' && vars.STAGING_DEPLOY_ENABLED != 'true'
    needs: [images]
    uses: ./.github/workflows/deploy.yml
    with: { environment: production, app_dir: /opt/crm, sha: '${{ github.sha }}', verify: false }
    secrets: inherit
    permissions: { contents: read, packages: read }
