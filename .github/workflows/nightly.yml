name: Nightly

# Checks too slow for every pull request (CD-250): the time report's performance target with
# generated data (100,000 time entries, 2,000 tasks, 200 people; backend/test/performance).
# Runs every night on main and on demand, with the same database setup as the integration tests.

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  performance:
    uses: ./.github/workflows/db-tests.yml
    with: { script: test:performance }
